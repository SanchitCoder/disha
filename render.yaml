# Render Blueprint: deploys the FastAPI backend (no Docker). Create it with "New > Blueprint" and point it at this repo.
services:
  - type: web
    name: disha-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false            # paste in the Render dashboard; never commit it
      - key: GROQ_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_STT_MODEL
        value: whisper-large-v3
      - key: SUPABASE_URL
        sync: false            # optional
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # optional
